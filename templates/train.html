<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graph Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #18181f;
    --border: #222230;
    --accent: #7c6ff7;
    --accent2: #a78bfa;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f59e0b;
    --text: #e2e2f0;
    --muted: #55556a;
    --dim: #2a2a3a;
    --font: 'DM Sans', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }

  html, body {
    height: 100%;
    width: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    overflow: hidden;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 960px;
    margin: 0 auto;
  }

  /* Top bar */
  #topbar {
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }

  .tb-dots { display: flex; gap: 7px; }
  .tb-dot { width: 12px; height: 12px; border-radius: 50%; }
  .tb-dot.r { background: #ef4444; }
  .tb-dot.y { background: #f59e0b; }
  .tb-dot.g { background: #22c55e; }

  #tb-title {
    margin-left: 10px;
    font-size: 13px;
    color: var(--muted);
    font-family: var(--mono);
    letter-spacing: .03em;
  }

  #ws-badge {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    font-family: var(--mono);
    color: var(--muted);
    padding: 5px 12px;
    border-radius: 20px;
    border: 0.5px solid var(--border);
    background: var(--surface2);
  }

  #ws-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: background .3s;
  }

  #ws-dot.on {
    background: var(--green);
    box-shadow: 0 0 8px #22c55e55;
    animation: wspulse 2s infinite;
  }

  @keyframes wspulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* Main layout */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 24px;
    gap: 16px;
    overflow: hidden;
  }

  /* Input row */
  #input-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-shrink: 0;
  }

  #topic {
    flex: 1;
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 13px 18px;
    font-size: 14px;
    font-family: var(--font);
    color: var(--text);
    outline: none;
    transition: border-color .15s;
    height: 48px;
  }

  #topic::placeholder { color: var(--muted); }
  #topic:focus { border-color: var(--accent); }

  #train-btn {
    height: 48px;
    padding: 0 24px;
    border-radius: 12px;
    background: var(--accent);
    border: none;
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    font-family: var(--font);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: opacity .15s, transform .1s;
    white-space: nowrap;
    flex-shrink: 0;
  }

  #train-btn:hover { opacity: .85; }
  #train-btn:active { transform: scale(.97); }
  #train-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* Stats */
  #stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    flex-shrink: 0;
  }

  .stat {
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
  }

  .stat-val {
    font-size: 22px;
    font-weight: 500;
    font-family: var(--mono);
    color: var(--text);
  }

  .stat-lbl {
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
  }

  /* Terminal */
  #terminal {
    flex: 1;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  #term-header {
    padding: 10px 16px;
    border-bottom: 0.5px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  #term-label {
    font-size: 10px;
    font-family: var(--mono);
    color: var(--muted);
    letter-spacing: .08em;
  }

  #term-topic {
    font-size: 11px;
    font-family: var(--mono);
    color: var(--accent2);
    margin-left: 4px;
  }

  #clear-btn {
    margin-left: auto;
    font-size: 11px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--mono);
    padding: 3px 8px;
    border-radius: 5px;
    transition: color .15s, background .15s;
  }

  #clear-btn:hover { color: var(--text); background: var(--dim); }

  #logs {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  #logs::-webkit-scrollbar { width: 4px; }
  #logs::-webkit-scrollbar-track { background: transparent; }
  #logs::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 4px; }

  .log-line {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.65;
    animation: logfade .15s ease;
  }

  @keyframes logfade {
    from { opacity: 0; transform: translateX(-4px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .log-time {
    color: var(--muted);
    flex-shrink: 0;
    user-select: none;
    min-width: 70px;
  }

  .log-prefix {
    flex-shrink: 0;
    min-width: 14px;
  }

  .log-text { color: #c9c9e0; word-break: break-all; }

  .log-line.success .log-text { color: var(--green); }
  .log-line.success .log-prefix { color: var(--green); }
  .log-line.error .log-text { color: var(--red); }
  .log-line.error .log-prefix { color: var(--red); }
  .log-line.warn .log-text { color: var(--yellow); }
  .log-line.warn .log-prefix { color: var(--yellow); }
  .log-line.info .log-text { color: var(--accent2); }
  .log-line.info .log-prefix { color: var(--accent2); }
  .log-line.dim .log-text { color: var(--muted); }
  .log-line.dim .log-prefix { color: var(--muted); }

  /* Progress */
  #progress-wrap {
    padding: 0 16px 14px;
    flex-shrink: 0;
    display: none;
  }

  #progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    font-family: var(--mono);
    color: var(--muted);
    margin-bottom: 6px;
  }

  #progress-track {
    height: 3px;
    background: var(--dim);
    border-radius: 2px;
    overflow: hidden;
  }

  #progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width .4s ease;
  }

  /* Sidebar for wide screens */
  @media (min-width: 1200px) {
    #app {
      max-width: 100%;
      flex-direction: row;
    }

    #left {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 0.5px solid var(--border);
      min-width: 0;
    }

    #sidebar {
      display: flex;
      flex-direction: column;
      width: 260px;
      flex-shrink: 0;
      background: var(--surface);
      padding: 24px 18px;
      gap: 24px;
      overflow-y: auto;
    }
  }

  #sidebar { display: none; }

  .side-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: .08em;
    font-family: var(--mono);
    margin-bottom: 12px;
  }

  .side-section { }

  #recent-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .recent-item {
    padding: 8px 12px;
    border-radius: 8px;
    background: var(--surface2);
    border: 0.5px solid var(--border);
    font-size: 12px;
    font-family: var(--mono);
    color: var(--muted);
    cursor: pointer;
    transition: border-color .15s, color .15s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .recent-item:hover { border-color: var(--accent); color: var(--accent2); }
  .recent-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

  .shortcut-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .shortcut {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
  }

  .shortcut-key {
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 5px;
    background: var(--surface2);
    border: 0.5px solid var(--border);
    color: var(--muted);
  }

  .shortcut-desc { color: var(--muted); }

  #reconnect-row { display: flex; align-items: center; gap: 6px; margin-left: auto; margin-right: 10px; }
  #reconnect-input { background: var(--surface2); border: 0.5px solid var(--border); border-radius: 8px; padding: 5px 10px; font-size: 11px; font-family: var(--mono); color: var(--text); outline: none; width: 240px; height: 30px; transition: border-color .15s; }
  #reconnect-input::placeholder { color: var(--muted); }
  #reconnect-input:focus { border-color: var(--accent); }
  #reconnect-btn { height: 30px; padding: 0 12px; border-radius: 8px; background: var(--surface2); border: 0.5px solid var(--border); color: var(--accent2); font-size: 11px; font-family: var(--mono); cursor: pointer; white-space: nowrap; transition: border-color .15s, color .15s; }
  #reconnect-btn:hover { border-color: var(--accent); color: #fff; }
</style>
</head>
<body>

<div id="app">

  <!-- Left / main column -->
  <div id="left">
    <div id="topbar">
      <div class="tb-dots">
        <div class="tb-dot r"></div>
        <div class="tb-dot y"></div>
        <div class="tb-dot g"></div>
      </div>
      <div id="tb-title">graph-trainer — console</div>
      <div id="reconnect-row"><input id="reconnect-input" type="text" placeholder="Reconnect to job ID..." autocomplete="off" /><button id="reconnect-btn" onclick="reconnectJob()">↩ Reconnect</button></div>
      <div id="ws-badge">
        <div id="ws-dot"></div>
        <span id="ws-label">disconnected</span>
      </div>
    </div>

    <div id="main">
      <div id="input-row">
        <input id="topic" type="text" placeholder="Enter topic — e.g. Tesla, Apple Inc., OpenAI" autocomplete="off" />
        <button id="train-btn" onclick="startTraining()">
          ⚡ Train
        </button>
      </div>

      <div id="stats-row">
        <div class="stat">
          <div class="stat-val" id="s-jobs">0</div>
          <div class="stat-lbl">Jobs run</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="s-msgs">0</div>
          <div class="stat-lbl">Log lines</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="s-errors">0</div>
          <div class="stat-lbl">Errors</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="s-status">idle</div>
          <div class="stat-lbl">Status</div>
        </div>
      </div>

      <div id="terminal">
        <div id="term-header">
          <span id="term-label">OUTPUT LOG</span>
          <span id="term-topic"></span>
          <button id="clear-btn" onclick="clearLogs()">clear</button>
        </div>
        <div id="logs">
          <div class="log-line dim">
            <span class="log-time">--:--:--</span>
            <span class="log-prefix">›</span>
            <span class="log-text">Waiting for training job...</span>
          </div>
        </div>
        <div id="progress-wrap">
          <div id="progress-info">
            <span id="progress-label">Training progress</span>
            <span id="progress-pct">0%</span>
          </div>
          <div id="progress-track">
            <div id="progress-bar"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Sidebar (wide screens only) -->
  <div id="sidebar">
    <div class="side-section">
      <div class="side-label">RECENT TOPICS</div>
      <div id="recent-list">
        <div class="recent-item dim-item" style="color:var(--muted);font-size:11px;border-style:dashed">No recent jobs yet</div>
      </div>
    </div>

    <div class="side-section">
      <div class="side-label">KEYBOARD SHORTCUTS</div>
      <div class="shortcut-list">
        <div class="shortcut">
          <span class="shortcut-desc">Start training</span>
          <span class="shortcut-key">Enter</span>
        </div>
        <div class="shortcut">
          <span class="shortcut-desc">Clear logs</span>
          <span class="shortcut-key">Ctrl+L</span>
        </div>
        <div class="shortcut">
          <span class="shortcut-desc">Focus input</span>
          <span class="shortcut-key">Ctrl+K</span>
        </div>
      </div>
    </div>

    <div class="side-section">
      <div class="side-label">MINI GRAPH</div>
      <svg viewBox="0 0 220 160" style="width:100%;opacity:.6">
        <line x1="110" y1="80" x2="55"  y2="35"  stroke="#2a2a38" stroke-width="1.5"/>
        <line x1="110" y1="80" x2="165" y2="35"  stroke="#2a2a38" stroke-width="1.5"/>
        <line x1="110" y1="80" x2="40"  y2="130" stroke="#2a2a38" stroke-width="1.5"/>
        <line x1="110" y1="80" x2="180" y2="130" stroke="#2a2a38" stroke-width="1.5"/>
        <line x1="55"  y1="35" x2="165" y2="35"  stroke="#2a2a38" stroke-width="1"/>
        <circle cx="110" cy="80"  r="16" fill="#4c3f9f" stroke="#7c6ff7" stroke-width="1.5"/>
        <circle cx="55"  cy="35"  r="10" fill="#1a2a1e" stroke="#2d5a35" stroke-width="1.5"/>
        <circle cx="165" cy="35"  r="10" fill="#1a2a1e" stroke="#2d5a35" stroke-width="1.5"/>
        <circle cx="40"  cy="130" r="10" fill="#1e1a3a" stroke="#4c3f9f" stroke-width="1.5"/>
        <circle cx="180" cy="130" r="10" fill="#1e1a3a" stroke="#4c3f9f" stroke-width="1.5"/>
        <text x="110" y="84"  text-anchor="middle" font-size="8" fill="#a78bfa" font-family="JetBrains Mono,monospace">KG</text>
        <text x="55"  y="39"  text-anchor="middle" font-size="7" fill="#4ade80" font-family="JetBrains Mono,monospace">OWL</text>
        <text x="165" y="39"  text-anchor="middle" font-size="7" fill="#4ade80" font-family="JetBrains Mono,monospace">RDF</text>
        <text x="40"  y="134" text-anchor="middle" font-size="7" fill="#a78bfa" font-family="JetBrains Mono,monospace">NLP</text>
        <text x="180" y="134" text-anchor="middle" font-size="7" fill="#a78bfa" font-family="JetBrains Mono,monospace">ML</text>
      </svg>
    </div>
  </div>

</div>

<script>
  let ws = null;
  let jobCount = 0;
  let lineCount = 0;
  let errorCount = 0;
  let progress = 0;
  let recentTopics = [];

  function ts() {
    const n = new Date();
    return [n.getHours(), n.getMinutes(), n.getSeconds()]
      .map(x => x.toString().padStart(2, '0')).join(':');
  }

  function log(msg, type = '') {
    const logs = document.getElementById('logs');
    const line = document.createElement('div');
    line.className = 'log-line ' + (type || '');

    const prefixMap = { success: '✓', error: '✗', warn: '⚠', info: '›', dim: '›', '': '›' };
    const prefix = prefixMap[type] || '›';

    line.innerHTML = `<span class="log-time">${ts()}</span><span class="log-prefix">${prefix}</span><span class="log-text">${msg}</span>`;
    logs.appendChild(line);
    logs.scrollTop = logs.scrollHeight;

    lineCount++;
    document.getElementById('s-msgs').textContent = lineCount;

    if (type === 'error') {
      errorCount++;
      document.getElementById('s-errors').textContent = errorCount;
    }

    if (type === 'success') {
      progress = Math.min(progress + 25, 95);
      setProgress(progress);
    }
  }

  function setProgress(pct) {
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('progress-pct').textContent = Math.round(pct) + '%';
    document.getElementById('progress-wrap').style.display = 'block';
  }

  function clearLogs() {
    document.getElementById('logs').innerHTML = '';
    lineCount = 0;
    document.getElementById('s-msgs').textContent = '0';
    progress = 0;
    document.getElementById('progress-bar').style.width = '0%';
    document.getElementById('progress-pct').textContent = '0%';
  }

  function setWS(connected) {
    const dot = document.getElementById('ws-dot');
    const lbl = document.getElementById('ws-label');
    if (connected) { dot.className = 'on'; lbl.textContent = 'connected'; }
    else            { dot.className = '';   lbl.textContent = 'disconnected'; }
  }

  function setStatus(s) {
    document.getElementById('s-status').textContent = s;
  }

  function addRecent(topic) {
    if (recentTopics.includes(topic)) return;
    recentTopics.unshift(topic);
    if (recentTopics.length > 5) recentTopics.pop();

    const list = document.getElementById('recent-list');
    list.innerHTML = '';
    recentTopics.forEach(t => {
      const item = document.createElement('div');
      item.className = 'recent-item';
      item.innerHTML = `<div class="recent-dot"></div>${t}`;
      item.onclick = () => { document.getElementById('topic').value = t; };
      list.appendChild(item);
    });
  }

  function resetBtn() {
    const btn = document.getElementById('train-btn');
    btn.disabled = false;
    btn.textContent = '⚡ Train';
  }

  async function startTraining() {
    const topic = document.getElementById('topic').value.trim();
    if (!topic) { log('Please enter a topic', 'error'); return; }

    const btn = document.getElementById('train-btn');
    btn.disabled = true;
    btn.textContent = '⏳ Training...';

    progress = 0;
    setProgress(0);
    errorCount = 0;
    document.getElementById('s-errors').textContent = '0';
    document.getElementById('term-topic').textContent = '— ' + topic;
    setStatus('running');
    jobCount++;
    document.getElementById('s-jobs').textContent = jobCount;
    addRecent(topic);

    log(`Starting training for: ${topic}`, 'info');

    try {
      const res = await fetch(`/train?topic=${encodeURIComponent(topic)}`, { method: 'POST' });
      const data = await res.json();
      log(`Job ID: ${data.job_id}`, 'dim');
      connectWS(data.job_id);
    } catch (e) {
      log('Failed to start training: ' + e.message, 'error');
      setStatus('error');
      resetBtn();
    }
  }

  function connectWS(jobId) {
    if (ws) ws.close();
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws/train/${jobId}`);

    ws.onopen = () => { setWS(true); log('Stream connected', 'dim'); };

    ws.onmessage = (e) => {
      const msg = e.data;
      const lower = msg.toLowerCase();

      // Update progress bar from chunk messages like "Processing chunk 3/50 — 6%"
      const pctMatch   = msg.match(/(\d+)%/);
      const chunkMatch = msg.match(/(\d+)\/(\d+)/);
      if (pctMatch) {
        setProgress(parseInt(pctMatch[1]));
      } else if (chunkMatch) {
        const pct = Math.round((parseInt(chunkMatch[1]) / parseInt(chunkMatch[2])) * 100);
        setProgress(pct);
      }

      if (lower.includes('error'))                                   { log(msg, 'error'); setStatus('error'); }
      else if (lower.includes('complete') || lower.includes('done')) { log(msg, 'success'); setStatus('done'); setProgress(100); resetBtn(); }
      else if (lower.includes('warn'))                               { log(msg, 'warn'); }
      else                                                           { log(msg); }
    };

    ws.onclose = () => { setWS(false); log('Stream closed', 'dim'); resetBtn(); };
    ws.onerror = () => { log('WebSocket error', 'error'); setWS(false); setStatus('error'); };
  }

  function reconnectJob() {
    const jobId = document.getElementById("reconnect-input").value.trim();
    if (!jobId) { log("Please enter a job ID to reconnect", "error"); return; }
    log("Reconnecting to job: " + jobId, "info");
    document.getElementById("reconnect-input").value = "";
    setStatus("running");
    document.getElementById("train-btn").disabled = true;
    document.getElementById("train-btn").textContent = "⏳ Training...";
    setProgress(0);
    connectWS(jobId);
  }

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.activeElement === document.getElementById('topic')) {
      startTraining();
    }
    if (e.ctrlKey && e.key === 'l') { e.preventDefault(); clearLogs(); }
    if (e.ctrlKey && e.key === 'k') { e.preventDefault(); document.getElementById('topic').focus(); }
    if (e.key === 'Enter' && document.activeElement === document.getElementById('reconnect-input')) { reconnectJob(); }
  });
</script>

</body>
</html>
